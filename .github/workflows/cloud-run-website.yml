name: Docker Build and Push to Artifact Registry

on:
  push:
    branches: [ deploy/website/production ]  

env:
  PROJECT_ID: ${{ secrets.CLOUD_RUN_PROJECT_ID }}
  GAR_LOCATION: us-central1  # Artifact Registry region (e.g., us-central1)
  REPOSITORY: next-aura-design  # Name of your Artifact Registry repository
  IMAGE: main  # Name of your Docker image

jobs:
  build-and-push:
    name: Tagged Docker release to Google Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v3

      - name: Build and tag image
        run: |-
          docker build ./apps/website --tag "${{env.GAR_LOCATION}}-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.REPOSITORY}}/${{env.IMAGE}}:$GITHUB_SHA"  \
            --build-arg NEXT_PUBLIC_ENV="production" \

      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.CLOUD_RUN_CREDENTIALS }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Check and Create Repository (if needed)
        run: |-
          if ! gcloud artifacts repositories describe ${{ env.REPOSITORY }} --location=us-central1; then
            gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=us-central1
          fi
            
      - name: Login to Artifact Registry
        uses: docker/login-action@v1
        with:
            registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
            username: oauth2accesstoken
            password: ${{ steps.auth.outputs.access_token }}

      - name: 'Docker push to Artifact Registry'
        run: |-
          docker push "${{env.GAR_LOCATION}}-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.REPOSITORY}}/${{env.IMAGE}}:$GITHUB_SHA"
      - name: Deploy
        run: |-
            gcloud run deploy ${{ env.REPOSITORY }} --image ${{env.GAR_LOCATION}}-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.REPOSITORY}}/${{env.IMAGE}}:$GITHUB_SHA \
              --project ${{env.PROJECT_ID}} \
              --platform managed \
              --region ${{env.GAR_LOCATION}} \
              --allow-unauthenticated \
              --quiet
          