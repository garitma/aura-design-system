# SonarQube / SonarCloud — shared scanner settings.
# Auth and host URL are passed via CLI (-Dsonar.login, -Dsonar.host.url) or CI env.

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Next.js / Node: do not analyze dependencies, build output, or lockfiles.
sonar.exclusions=**/node_modules/**,**/.pnpm/**,**/.next/**,**/out/**,**/build/**,**/coverage/**,**/pnpm-lock.yaml,**/*.tsbuildinfo,**/.scannerwork/**,**/.cursor/**,**/public/**
